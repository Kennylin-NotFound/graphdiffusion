dataset:
  name: phase6e-e-controlled-shift
  base_seed: 2026070801
  output: artifacts/datasets/phase6e-e-controlled-shift

  contract:
    family: final_main
    expected_instance_count: 336
    base_partition: base_train
    controlled_shifts:
      test_id_reference: []
      shift_high_sharing: [share_probability]
      shift_low_compatibility: [compatibility_density]
      shift_tight_capacity: [capacity_slack]
      shift_unseen_workflow: [application_type_pool]
    labeling:
      target_size: 16
      beta: 5.0
      total_time_limit_seconds: 120.0
      mip_gap: 0.0
      threads: 1
      seed: 0

  partitions:
