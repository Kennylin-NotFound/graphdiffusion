      service_count_range: [8, 18]
      max_generation_attempts: 500
      num_applications: [2, 5]
      num_devices: [5, 9]
      share_probability: [0.30, 0.70]
      compatibility_density: [0.35, 0.75]
      topology_density: [0.25, 0.65]
      capacity_slack: [0.10, 0.40]
      minimum_candidates: 2
      application_type_pool: [0, 1, 2, 3, 4]

