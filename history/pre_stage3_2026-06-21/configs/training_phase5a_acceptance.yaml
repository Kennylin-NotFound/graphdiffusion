training:
  run_name: phase5a-acceptance
  dataset_root: artifacts/datasets/phase1b-smoke
  train_partitions: [train]
  validation_partitions: [validation]
  seed: 20260615
  device: cpu
  batch_size: 2
  steps: 6
  log_interval: 1
  denoising_validation_interval: 2
  constrained_validation_interval: 3
  checkpoint_interval: 2
  learning_rate: 0.001
  weight_decay: 0.00001
  gradient_clip_norm: 1.0
  target_sampling: energy
  capacity_weight: 0.1
  link_weight: 0.1

diffusion:
  steps: 4
  beta_start: 0.0001
  beta_end: 0.2

model:
  hidden_dim: 16
  layers: 1
  dropout: 0.0

constrained_validation:
  num_samples: 1
  sample_batch_size: 1
  reverse_steps: 1
  repair_max_moves: 10
  fallback_max_search_nodes: 100000
  instance_limit: 1
