experiment:
  schema_version: "1.0"
  name: phase6a-acceptance
  dataset_root: artifacts/datasets/phase5b-pilot
  dataset_freeze: dataset_freeze.json
  partitions:
    - test_id
  instance_limit: 2
  seed: 20260615
  device: cuda
  deterministic: false
  output_root: artifacts/phase6a-acceptance
  timing_scope:
    - sampling_seconds
    - verification_seconds
    - repair_seconds
    - fallback_seconds
    - exact_evaluation_seconds
    - selection_seconds
    - total_seconds
  methods:
    - method_id: learned_hybrid
      kind: learned_hybrid
      checkpoint: artifacts/runs/20260615T040516Z-phase5c-pilot/best_checkpoint.pt
      proposal_group: learned-main
      inference:
        num_samples: 4
        sample_batch_size: 4
        reverse_steps: 25
        repair_max_moves: 10
        fallback_max_search_nodes: 100000
    - method_id: random_hybrid
      kind: random_hybrid
      proposal_group: random-main
      inference:
        num_samples: 4
        sample_batch_size: 4
        repair_max_moves: 10
        fallback_max_search_nodes: 100000
    - method_id: fallback_only
      kind: fallback_only
      inference:
        fallback_max_search_nodes: 100000
  claims:
    - claim_id: learned_quality_beyond_fallback
      question: Does the learned hybrid improve solution quality beyond fallback?
      hypothesis: Learned proposals reduce the exact latency gap while preserving feasibility.
      comparison:
        - learned_hybrid
        - fallback_only
      primary_metric: gap_to_pool_best
    - claim_id: learned_proposal_value
      question: Are learned proposals more feasible than random compatible proposals?
      hypothesis: Learned proposals have a higher raw feasible rate than random proposals.
      comparison:
        - learned_hybrid
        - random_hybrid
      primary_metric: raw_feasible_rate
