experiment:
  schema_version: '1.0'
  name: phase6e-b-final-id-seed20260622
  dataset_root: artifacts/datasets/phase6c-final-main
  dataset_freeze: dataset_freeze.json
  partitions:
  - test_id
  seed: 20260622
  device: cuda
  deterministic: true
  output_root: artifacts/phase6e-b-evaluation
  methods:
  - method_id: best_full
    kind: learned_hybrid
    checkpoint: artifacts/phase6e-b-training/full-runs/20260618T163037Z-phase6e-b-best_full-seed20260622/best_checkpoint.pt
    proposal_group: phase6e-b-paired-proposals
    inference: &id001
      num_samples: 4
      sample_batch_size: 4
      reverse_steps: 25
      repair_max_moves: 10
      fallback_max_search_nodes: 100000
  - method_id: energy_full
    kind: learned_hybrid
    checkpoint: artifacts/runs/20260615T070248Z-phase6c-final-acceptance/best_checkpoint.pt
    proposal_group: phase6e-b-paired-proposals
    inference: *id001
  - method_id: energy_no_capacity
    kind: learned_hybrid
    checkpoint: artifacts/phase6e-b-training/full-runs/20260618T161525Z-phase6e-b-energy_no_capacity-seed20260622/best_checkpoint.pt
    proposal_group: phase6e-b-paired-proposals
    inference: *id001
  - method_id: energy_no_guidance
    kind: learned_hybrid
    checkpoint: artifacts/phase6e-b-training/full-runs/20260618T160008Z-phase6e-b-energy_no_guidance-seed20260622/best_checkpoint.pt
    proposal_group: phase6e-b-paired-proposals
    inference: *id001
  - method_id: energy_no_link
    kind: learned_hybrid
    checkpoint: artifacts/phase6e-b-training/full-runs/20260618T162303Z-phase6e-b-energy_no_link-seed20260622/best_checkpoint.pt
    proposal_group: phase6e-b-paired-proposals
    inference: *id001
  - method_id: uniform_full
    kind: learned_hybrid
    checkpoint: artifacts/phase6e-b-training/full-runs/20260618T160748Z-phase6e-b-uniform_full-seed20260622/best_checkpoint.pt
    proposal_group: phase6e-b-paired-proposals
    inference: *id001
  claims:
  - claim_id: energy_weighting
    question: Does energy-weighted target sampling improve verified deployment quality?
    hypothesis: Energy weighting lowers exact latency gap relative to uniform target
      sampling.
    comparison:
    - energy_full
    - uniform_full
    primary_metric: gap_to_pool_best
  - claim_id: soft_guidance
    question: Does soft constraint guidance improve raw proposal quality and reduce
      fallback burden?
    hypothesis: Full guidance improves raw feasibility and post-processing burden
      relative to no guidance.
    comparison:
    - energy_full
    - energy_no_guidance
    primary_metric: raw_feasible_rate
  - claim_id: all_phase6eb_variants
    question: How do all locked training variants compare under a common final-ID
      evaluator?
    hypothesis: The variants expose mechanism-specific quality and feasibility tradeoffs.
    comparison:
    - best_full
    - energy_full
    - energy_no_capacity
    - energy_no_guidance
    - energy_no_link
    - uniform_full
    primary_metric: gap_to_pool_best
